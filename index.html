<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ebb扫雷之噩梦开始</title>
    <style>
        body {
            background-color: #3855a7;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            touch-action: manipulation;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 10px auto;
        }
        h1 {
            margin: 0;
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .lang-select {
            padding: 5px 10px;
            background-color: #2c2c2c;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .controls {
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }
        button {
            padding: 8px 14px;
            background-color: #2c2c2c;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.95rem;
        }
        button:hover {
            background-color: #ffffff;
            color: #3855a7;
        }
        /* 手機模式切換按鈕專用樣式 */
        #btn-mode {
            background-color: #1a2640;
            border: 2px solid #5879b5;
        }
        #btn-mode.flag-mode {
            background-color: #b33939;
            border-color: #ff5252;
        }
        #status {
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: bold;
            min-height: 28px;
            color: #ffffff;
        }
        canvas {
            background-color: #1a2640;
            border: 2px solid #5879b5;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            border-radius: 8px;
            cursor: pointer;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }
        .visitor-counter {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: rgba(28, 43, 66, 0.9);
            border: 1px solid #5879b5;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 999;
        }
        .visitor-counter img {
            height: 20px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1 id="title">ebb扫雷之噩梦开始</h1>
        <div>
            <select id="langSelect" class="lang-select">
                <option value="zh-CN" selected>简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <div class="controls">
        <button id="btn-easy">简单</button>
        <button id="btn-medium">普通</button>
        <button id="btn-hard">困难</button>
        <button id="btn-hell">地狱</button>
        <button id="btn-restart">重新开始</button>
        <!-- 手機切換按鈕 -->
        <button id="btn-mode">⛏️ 挖掘模式</button>
    </div>
    
    <div id="status">请选择难度开始游戏</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="visitor-counter">
        <span id="counterLabel">👀 访问人数:</span>
        <img src="https://hits.sh/ebb-minesweeper-nightmare.hits.svg?style=flat-square&label=Hits&color=3855a7&labelColor=1a2640" alt="Hits Counter">
